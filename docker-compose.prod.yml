# Production HTTPS deployment (issue #217).
#
# Standalone compose file — intentionally NOT an override of docker-compose.yml.
# Compose `ports:` entries are merged, not removed, by override files, so a
# second file cannot un-publish the host ports docker-compose.yml opens for
# local development. This file fully re-declares control-server, dashboard,
# and caddy so control-server/dashboard never bind to a host port; only Caddy
# is exposed to the internet (80/443), terminating TLS via Automatic HTTPS
# and reverse-proxying to the Dashboard, which in turn proxies `/api/*` to
# the Control Server (see apps/dashboard/nginx.conf).
#
# Usage: see docs/deployment-https.md
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  control-server:
    build:
      context: .
      dockerfile: apps/control-server/Dockerfile
    # Local build output: publish it first when a registry digest is required.
    image: probe-agent/control-server:latest
    container_name: probe-control-server
    environment:
      PROBE_API_KEY: ${PROBE_API_KEY:-}
      PROBE_DB_PATH: /data/probe.db
      CONTROL_ADMIN_USERNAME: ${CONTROL_ADMIN_USERNAME:-}
      CONTROL_ADMIN_PASSWORD: ${CONTROL_ADMIN_PASSWORD:-}
      # Issue #225: strict fail-closed production mode. Startup refuses to
      # boot without an active admin, refuses CONTROL_API_KEYS (legacy
      # shared keys are forbidden -- removed below on purpose), and rejects
      # sample/weak CONTROL_ADMIN_PASSWORD values. See
      # docs/deployment-https.md "公開前チェック".
      CONTROL_ENV: "production"
      # Fail startup instead of silently running without authentication.
      # Forced on for CONTROL_ENV=production anyway; kept explicit here.
      CONTROL_REQUIRE_AUTH: "true"
      # Issue #273: production has no implicit resource-limit defaults.
      CONTROL_TRACE_RATE_LIMIT_PER_SECOND: ${CONTROL_TRACE_RATE_LIMIT_PER_SECOND:?Set CONTROL_TRACE_RATE_LIMIT_PER_SECOND}
      CONTROL_MANAGEMENT_RATE_LIMIT_PER_MINUTE: ${CONTROL_MANAGEMENT_RATE_LIMIT_PER_MINUTE:?Set CONTROL_MANAGEMENT_RATE_LIMIT_PER_MINUTE}
      CONTROL_LLM_DAILY_EXECUTION_LIMIT: ${CONTROL_LLM_DAILY_EXECUTION_LIMIT:?Set CONTROL_LLM_DAILY_EXECUTION_LIMIT}
      CONTROL_TRACE_MAX_ROWS_PER_SYSTEM: ${CONTROL_TRACE_MAX_ROWS_PER_SYSTEM:?Set CONTROL_TRACE_MAX_ROWS_PER_SYSTEM}
      CONTROL_TRACE_MAX_BYTES_PER_SYSTEM: ${CONTROL_TRACE_MAX_BYTES_PER_SYSTEM:?Set CONTROL_TRACE_MAX_BYTES_PER_SYSTEM}
      # Issue #270: code execution is handed off through shared volumes; the
      # Control Server never receives the Docker socket.
      PROBE_EXECUTION_BACKEND: "worker"
      PROBE_EXECUTION_SPOOL_ROOT: /execution-spool
      PROBE_EXECUTION_WORKSPACE_ROOT: /execution-workspaces
      PROBE_EXECUTION_WORKER_UID: "65534"
      PROBE_WORKTREE_BASE: /execution-workspaces/validation
      PROBE_REPLAY_WORKSPACE_BASE: /execution-workspaces/replay
      PROBE_EXPERIMENT_WORKSPACE_BASE: /execution-workspaces/experiments
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-120}
      INTELLIGENCE_LLM_PROVIDER: ${INTELLIGENCE_LLM_PROVIDER:-}
      INTELLIGENCE_LLM_MODEL: ${INTELLIGENCE_LLM_MODEL:-}
      INTELLIGENCE_LLM_TIMEOUT: ${INTELLIGENCE_LLM_TIMEOUT:-120}
      INTELLIGENCE_MAX_OUTPUT_TOKENS: ${INTELLIGENCE_MAX_OUTPUT_TOKENS:-128000}
      INTELLIGENCE_REVIEW_MAX_OUTPUT_TOKENS: ${INTELLIGENCE_REVIEW_MAX_OUTPUT_TOKENS:-32768}
      INTELLIGENCE_REVIEW_MAX_NODES_PER_TYPE: ${INTELLIGENCE_REVIEW_MAX_NODES_PER_TYPE:-5}
      INTELLIGENCE_REVIEW_MAX_PROMPT_CHARS: ${INTELLIGENCE_REVIEW_MAX_PROMPT_CHARS:-30000}
      SNAPSHOT_MAX_FILE_SIZE: ${SNAPSHOT_MAX_FILE_SIZE:-524288}
      WORKSPACE_CONTEXT_MAX_CATEGORY_CHARS: ${WORKSPACE_CONTEXT_MAX_CATEGORY_CHARS:-12000}
      WORKSPACE_CONTEXT_MAX_CHARS: ${WORKSPACE_CONTEXT_MAX_CHARS:-50000}
      PROBE_REPOSITORY_ROOTS: /repositories
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      # Fixed in-container path of the Compose secret mounted below -- never
      # a host path. Compose mounts secrets read-only by default. See
      # docs/github-app-deployment.md for placing the PEM on the host and
      # for key rotation; the PEM must NOT live under
      # PROBE_REPOSITORY_HOST_ROOT or on the probe-data volume, so
      # repository mounts and DB/volume backups never contain it.
      GITHUB_APP_PRIVATE_KEY_PATH: /run/secrets/github_app_private_key
      GITHUB_PUBLISH_ENABLED: ${GITHUB_PUBLISH_ENABLED:-false}
      GITHUB_API_BASE_URL: ${GITHUB_API_BASE_URL:-}
      GITHUB_WEB_BASE_URL: ${GITHUB_WEB_BASE_URL:-}
      GIT_REPOSITORY_ROOT: /data/git-repositories
      GIT_BRANCH_PREFIX: ${GIT_BRANCH_PREFIX:-probe/}
      GIT_ALLOW_DIRECT_PUSH: ${GIT_ALLOW_DIRECT_PUSH:-false}
      GIT_ALLOW_FORCE_PUSH: ${GIT_ALLOW_FORCE_PUSH:-false}
      GIT_ALLOW_WORKFLOW_CHANGES: ${GIT_ALLOW_WORKFLOW_CHANGES:-false}
      GITHUB_APP_BOT_NAME: ${GITHUB_APP_BOT_NAME:-probe-agent[bot]}
      GITHUB_APP_BOT_EMAIL: ${GITHUB_APP_BOT_EMAIL:-probe-agent[bot]@users.noreply.github.com}
    volumes:
      - probe-data:/data
      - ${PROBE_REPOSITORY_HOST_ROOT:?Set PROBE_REPOSITORY_HOST_ROOT}:/repositories:rw
      - execution-spool:/execution-spool
      - execution-workspaces:/execution-workspaces
    secrets:
      - github_app_private_key
    # No `ports:` — only Caddy is reachable from outside the compose network.
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/health', timeout=2).status == 200 else sys.exit(1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  execution-worker:
    build:
      context: .
      dockerfile: apps/control-server/Dockerfile
    # Same locally built artifact as control-server; no fabricated digest.
    image: probe-agent/control-server:latest
    container_name: probe-execution-worker
    user: "65534:65534"
    command: ["python", "-m", "app.execution_worker"]
    environment:
      PROBE_EXECUTION_SPOOL_ROOT: /execution-spool
      PROBE_EXECUTION_WORKSPACE_ROOT: /execution-workspaces
      PROBE_EXECUTION_WORKER_POLL_SECONDS: "0.05"
      PROBE_EXECUTION_MAX_OUTPUT_BYTES: "65536"
    volumes:
      - execution-spool:/execution-spool
      - execution-workspaces:/execution-workspaces
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      # Docker's default seccomp profile conditionally blocks unshare(2)
      # without CAP_SYS_ADMIN. The worker has no capabilities; bwrap needs
      # this syscall solely to create its unprivileged user/mount namespace.
      # The remaining outer and inner isolation controls stay enforced.
      - seccomp:unconfined
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    pids_limit: 128
    mem_limit: 512m
    cpus: "1.0"
    restart: unless-stopped

  dashboard:
    build:
      context: ./apps/dashboard
    # Local build output: publish it first when a registry digest is required.
    image: probe-agent/dashboard:latest
    container_name: probe-dashboard
    environment:
      # Public HTTPS URL of the Control API, e.g. https://probe.example.com/api
      PROBE_CLIENT_SERVER_URL: ${PROBE_CLIENT_SERVER_URL:?Set PROBE_CLIENT_SERVER_URL}
    # No `ports:` — only Caddy is reachable from outside the compose network.
    expose:
      - "8501"
    depends_on:
      control-server:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    container_name: probe-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set PUBLIC_HOST}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - dashboard
    restart: unless-stopped

volumes:
  probe-data:
  execution-spool:
  execution-workspaces:
  caddy-data:
  caddy-config:

# GitHub App private key (Issue #224). Compose mounts secrets read-only by
# default; the container only ever sees it at GITHUB_APP_PRIVATE_KEY_PATH
# above (/run/secrets/github_app_private_key), never as a host path. The
# /dev/null default lets publish-disabled deployments start with no PEM on
# the host at all -- the secret mounts as an empty file, and
# `github_app_configured()` treats an empty key file as "not configured"
# (Issue #224) rather than failing later inside JWT signing. Point
# GITHUB_APP_PRIVATE_KEY_HOST_PATH at the real PEM (see
# docs/github-app-deployment.md) only once the publish workflow should be
# enabled. The PEM file itself must never be placed under
# PROBE_REPOSITORY_HOST_ROOT or on the probe-data volume, so that repository
# mounts and DB/volume backups never contain it.
secrets:
  github_app_private_key:
    file: ${GITHUB_APP_PRIVATE_KEY_HOST_PATH:-/dev/null}
